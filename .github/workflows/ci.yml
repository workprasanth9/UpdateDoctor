name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Text check (no em dashes)
        run: ./Scripts/check-text.sh

      - name: Standalone Jamf EA (shellcheck, fixture tests, live run)
        run: |
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck Jamf/*.sh Scripts/test-ea-standalone.sh
          /bin/bash --version | head -1
          /bin/bash Scripts/test-ea-standalone.sh
          # Live run on the runner, not root. Informational.
          /bin/bash Jamf/updatedoctor-ea-standalone.sh

      - name: Swift version and runner arch
        run: |
          swift --version
          uname -m
          xcode-select -p

      - name: Unit tests (XCTest, recorded fixtures, no MDM needed)
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
          grep -E "Executed [0-9]+ tests" test.log | tail -1

      - name: Build universal release
        run: ./Scripts/build-release.sh --universal

      - name: Smoke test on the runner
        run: |
          lipo -info dist/updatedoctor
          lipo -archs dist/updatedoctor | grep -q x86_64
          lipo -archs dist/updatedoctor | grep -q arm64
          lipo -archs dist/updatedoctor
          dist/updatedoctor version
                    dist/updatedoctor help
          # Hosted runners are not MDM managed. The report is informational here.
          dist/updatedoctor doctor --quick || true
          dist/updatedoctor doctor --quick --json > report.json || true
          python3 -c "import json; r=json.load(open('report.json')); print(r['verdict'], len(r['checks']), 'checks')"
          dist/updatedoctor doctor --quick --ea || true

      - name: Build universal menu bar app
        run: |
          ./Scripts/build-app.sh --universal
          lipo -archs dist/UpdateDoctor.app/Contents/MacOS/UpdateDoctor | grep -q x86_64
          lipo -archs dist/UpdateDoctor.app/Contents/MacOS/UpdateDoctor | grep -q arm64
          lipo -archs dist/UpdateDoctor.app/Contents/Resources/updatedoctor | grep -q x86_64
          lipo -archs dist/UpdateDoctor.app/Contents/Resources/updatedoctor | grep -q arm64
          lipo -info dist/UpdateDoctor.app/Contents/Resources/updatedoctor
          codesign -dv dist/UpdateDoctor.app 2>&1 | grep -E "flags|Signature"
          test -f dist/UpdateDoctor.app/Contents/Resources/AppIcon.icns
          dist/UpdateDoctor.app/Contents/MacOS/UpdateDoctor --self-test
          dist/UpdateDoctor.app/Contents/Resources/updatedoctor version
          VERSION=$(sed -nE 's/.*current = "(.*)".*/\1/p' Sources/UpdateDoctorKit/Version.swift)
          (cd dist && ditto -c -k --keepParent UpdateDoctor.app "UpdateDoctor-${VERSION}-app.zip")

      - name: Build installer package
        run: |
          ./Scripts/build-pkg.sh
          pkgutil --payload-files dist/UpdateDoctor-*.pkg | grep -E "UpdateDoctor.app$|updatedoctor$|AppIcon.icns$"
          cp Jamf/updatedoctor-ea-standalone.sh dist/
          (cd dist && shasum -a 256 updatedoctor-*.tar.gz updatedoctor-*.zip UpdateDoctor-*-app.zip UpdateDoctor-*.pkg updatedoctor-ea-standalone.sh > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: updatedoctor-macos-universal
          path: |
            dist/updatedoctor-*.tar.gz
            dist/updatedoctor-*.zip
            dist/UpdateDoctor-*-app.zip
            dist/UpdateDoctor-*.pkg
            dist/updatedoctor-ea-standalone.sh
            dist/SHA256SUMS.txt
